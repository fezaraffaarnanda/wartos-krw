<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Berita — BPS Kab. Tegal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../static/css/style.css" />
    <link rel="icon" href="../static/favicon.png" />
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="header-brand">
          <div class="header-logo">
            <img src="../static/bps.svg" alt="BPS Logo" height="40" />
          </div>
          <div class="header-text">
            <h1>Dashboard Fenomena Ekonomi</h1>
            <p class="header-subtitle">Badan Pusat Statistik Kabupaten Tegal</p>
          </div>
        </div>
        <div class="header-actions">
          <span class="header-user" id="headerUser"></span>
          <a href="/logout" class="btn-logout" id="btnLogout">Keluar</a>
        </div>
      </div>
    </header>

    <main class="main">
      <!-- Breadcrumb / Back -->
      <div class="breadcrumb">
        <a href="/" class="breadcrumb-link">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="15 18 9 12 15 6" />
          </svg>
          Kembali ke Dashboard
        </a>
      </div>

      <!-- Loading state -->
      <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <p>Memuat berita...</p>
      </div>

      <!-- Error state -->
      <div id="errorState" class="error-state" style="display: none">
        <svg
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <p id="errorMsg">Berita tidak ditemukan.</p>
        <a href="/" class="btn-back-home">Kembali ke Dashboard</a>
      </div>

      <!-- Article content -->
      <article class="article-card" id="articleCard" style="display: none">
        <header class="article-header">
          <h1 class="article-title" id="articleTitle"></h1>
          <div class="article-meta">
            <div class="meta-item">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <span id="articleSource">—</span>
            </div>
            <div class="meta-divider"></div>
            <div class="meta-item">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
              </svg>
              <span id="articleDate">—</span>
            </div>
            <div class="meta-divider"></div>
            <div class="meta-item">
              <svg
                width="15"
                height="15"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"
                />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
              </svg>
              <a
                href="#"
                id="articleExternalLink"
                target="_blank"
                rel="noopener noreferrer"
                class="meta-link"
                >Buka sumber asli</a
              >
            </div>
          </div>

          <!-- Tags -->
          <div class="article-tags" id="articleTags"></div>

          <!-- Klasifikasi KBLI & Aktivitas Ekonomi -->
          <div class="article-classification" id="articleClassification" style="display:none">
            <div class="classification-item" id="kbliItem">
              <span class="classification-label">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="3"/>
                  <path d="M3 9h18M9 21V9"/>
                </svg>
                KBLI
              </span>
              <span class="classification-badge kbli-badge" id="kbliBadge"></span>
            </div>
            <div class="classification-item" id="aktivitasItem">
              <span class="classification-label">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                </svg>
                Aktivitas Ekonomi
              </span>
              <span class="classification-badge aktivitas-badge" id="aktivitasBadge"></span>
            </div>
          </div>
        </header>

        <div class="article-divider"></div>

        <!-- Body -->
        <div class="article-body" id="articleBody"></div>
      </article>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>
        © 2026 Badan Pusat Statistik Kabupaten Tegal. Dashboard Fenomena Ekonomi
        — Kabupaten Tegal.
      </p>
    </footer>

      <script>
      // ── KBLI Mapping (sinkron dengan core/kbli_utils.py & script.js) ─────────
      const KBLI_KEY_MAPPING = {
        A:  "Pertanian, Kehutanan, dan Perikanan",
        B:  "Pertambangan dan Penggalian",
        C:  "Industri",
        D:  "Penyediaan Listrik, Gas, Uap/Air Panas, dan Udara Dingin",
        E:  "Penyediaan Air; Pengelolaan Air Limbah, Penanganan Limbah, dan Remediasi",
        F:  "Konstruksi",
        G:  "Perdagangan Besar dan Eceran",
        H:  "Transportasi dan Penyimpanan",
        I:  "Aktivitas Penyediaan Akomodasi dan Makan Minum",
        J:  "Aktivitas Penerbitan, Penyiaran, serta Produksi dan Distribusi Konten",
        K:  "Aktivitas Telekomunikasi, Pemrograman Komputer, Konsultansi, dan Jasa Informasi",
        L:  "Aktivitas Keuangan dan Asuransi",
        M:  "Aktivitas Real Estat",
        N:  "Aktivitas Profesional, Ilmiah, dan Teknis",
        O:  "Aktivitas Administratif dan Penunjang Usaha",
        P:  "Administrasi Pemerintahan dan Pertahanan, Serta Jaminan Sosial Wajib",
        Q:  "Pendidikan",
        R:  "Aktivitas Kesehatan Manusia dan Aktivitas Sosial",
        S:  "Kesenian, Olahraga, dan Rekreasi",
        T:  "Aktivitas Jasa Lainnya",
        U:  "Aktivitas Rumah Tangga sebagai Pemberi Kerja",
        V:  "Aktivitas Badan Internasional dan Badan Ekstra Internasional Lainnya",
        KE: "Kemiskinan",
        PG: "Pengangguran",
      };

      // ── Init ─────────────────────────────────────────────────────────────────
      document.addEventListener("DOMContentLoaded", async () => {
        await loadUserInfo();
        const id = getArticleId();
        if (!id) {
          showError("ID berita tidak valid.");
          return;
        }
        await loadArticle(id);
      });

      function getArticleId() {
        const parts = window.location.pathname.split("/");
        const id = parseInt(parts[parts.length - 1]);
        return isNaN(id) || id <= 0 ? null : id;
      }

      // ── User info ─────────────────────────────────────────────────────────────

      async function loadUserInfo() {
        try {
          const res = await fetch("/api/me");
          if (res.status === 401) {
            window.location.href = "/login";
            return;
          }
          const json = await res.json();
          if (json.status === "ok") {
            document.getElementById("headerUser").textContent = json.username;
          }
        } catch (e) {
          /* silently ignore */
        }
      }

      // ── Load article ──────────────────────────────────────────────────────────

      async function loadArticle(id) {
        try {
          const res = await fetch(`/api/berita/${id}`);
          if (res.status === 401) {
            window.location.href = "/login";
            return;
          }
          const json = await res.json();

          document.getElementById("loadingState").style.display = "none";

          if (json.status !== "ok" || !json.data) {
            showError(json.message || "Berita tidak ditemukan.");
            return;
          }

          renderArticle(json.data);
        } catch (err) {
          document.getElementById("loadingState").style.display = "none";
          showError("Gagal memuat berita. Coba lagi nanti.");
        }
      }

      function renderArticle(d) {
        document.title = `${d.title || "Detail Berita"} — BPS Kab. Tegal`;

        document.getElementById("articleTitle").textContent = d.title || "—";
        document.getElementById("articleSource").textContent = d.source || "—";
        document.getElementById("articleDate").textContent = d.date || "—";

        const extLink = document.getElementById("articleExternalLink");
        if (d.url) {
          extLink.href = d.url;
        } else {
          extLink.parentElement.style.display = "none";
        }

        // Tags
        const tagsContainer = document.getElementById("articleTags");
        if (d.tags) {
          const tags = d.tags
            .split(/\s*\|\s*|,\s*/)
            .map((t) => t.trim().replace(/^#/, ""))
            .filter(Boolean);
          tagsContainer.innerHTML = tags
            .map((t) => `<span class="tag-chip">#${escapeHtml(t)}</span>`)
            .join(" ");
        }

        // Klasifikasi KBLI & Aktivitas Ekonomi
        renderClassification(d.kbli, d.aktivitas_ekonomi);

        // Body: split paragraphs by newline
        const bodyEl = document.getElementById("articleBody");
        const paragraphs = (d.content || "Isi berita tidak tersedia.")
          .split(/\n+/)
          .filter((p) => p.trim());
        bodyEl.innerHTML = paragraphs
          .map((p) => `<p>${escapeHtml(p.trim())}</p>`)
          .join("");

        document.getElementById("articleCard").style.display = "block";
      }

      function renderClassification(kbliRaw, aktivitasRaw) {
        const section = document.getElementById("articleClassification");
        const kbliBadge = document.getElementById("kbliBadge");
        const aktivitasBadge = document.getElementById("aktivitasBadge");

        let hasContent = false;

        // ── KBLI ──
        if (kbliRaw && kbliRaw.trim()) {
          const kode = kbliRaw.trim().toUpperCase();
          const isIrrelevant = kode === "TIDAK RELEVAN" || kode === "—";

          if (isIrrelevant) {
            kbliBadge.textContent = "Tidak Relevan";
            kbliBadge.classList.add("badge-irrelevant");
          } else {
            const deskripsi = KBLI_KEY_MAPPING[kode];
            kbliBadge.innerHTML = deskripsi
              ? `<strong>${escapeHtml(kode)}</strong> — ${escapeHtml(deskripsi)}`
              : escapeHtml(kode);
          }
          hasContent = true;
        } else {
          kbliBadge.textContent = "Belum diklasifikasi";
          kbliBadge.classList.add("badge-pending");
          hasContent = true;
        }

        // ── Aktivitas Ekonomi ──
        if (aktivitasRaw && aktivitasRaw.trim()) {
          const val = aktivitasRaw.trim();
          const isIrrelevant = val.toLowerCase() === "tidak relevan" || val === "—";

          if (isIrrelevant) {
            aktivitasBadge.textContent = "Tidak Relevan";
            aktivitasBadge.classList.add("badge-irrelevant");
          } else {
            // Format: "9/Aktivitas industri makanan dan minuman selain CPO"
            const slashIdx = val.indexOf("/");
            if (slashIdx !== -1) {
              const nomor = val.slice(0, slashIdx).trim();
              const label = val.slice(slashIdx + 1).trim();
              aktivitasBadge.innerHTML = `<strong>${escapeHtml(nomor)}</strong> — ${escapeHtml(label)}`;
            } else {
              aktivitasBadge.textContent = val;
            }
          }
          hasContent = true;
        } else {
          aktivitasBadge.textContent = "Belum diklasifikasi";
          aktivitasBadge.classList.add("badge-pending");
          hasContent = true;
        }

        if (hasContent) section.style.display = "flex";
      }

      function showError(msg) {
        document.getElementById("errorMsg").textContent = msg;
        document.getElementById("errorState").style.display = "flex";
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }
    </script>
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  </body>
</html>
