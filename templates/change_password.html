<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password — WARTOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/pages/auth.css">
    <link rel="icon" href="../static/favicon.png">
</head>

<body class="login-body">
    <div class="login-wrapper">
        <!-- Card -->
        <div class="login-card">
            <!-- Brand -->
            <div class="login-brand">
                <img src="../static/bps.svg" alt="BPS Logo" height="56">
                <div class="login-brand-text">
                    <h1>Ganti Password</h1>
                    <p>Warta Online Statistik</p>
                </div>
            </div>

            <div class="login-divider"></div>

            <!-- Notifikasi wajib ganti -->
            <div class="change-pw-note" id="mandatoryNote">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 8v4M12 16h.01"/>
                </svg>
                <p>
                    <strong>Wajib Ganti Password</strong>
                    Demi keamanan akun Anda, Anda harus mengganti password sebelum dapat mengakses dashboard.
                </p>
            </div>

            <!-- Form -->
            <form id="changePasswordForm" onsubmit="handleChangePassword(event)" novalidate>
                <div class="form-group">
                    <label class="form-label" for="newPassword">Password Baru</label>
                    <div class="input-password-wrapper">
                        <input
                            type="password"
                            id="newPassword"
                            class="form-input"
                            placeholder="Minimal 8 karakter"
                            maxlength="200"
                            autocomplete="new-password"
                            oninput="checkStrength(this.value)"
                            required>
                        <button type="button" class="btn-toggle-pw" onclick="togglePw('newPassword', 'eye1')" tabindex="-1" aria-label="Tampilkan/sembunyikan password">
                            <svg id="eye1" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <!-- Indikator kekuatan password -->
                    <div class="pw-strength">
                        <div class="pw-strength-bar">
                            <div class="pw-strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="pw-strength-text" id="strengthText"></span>
                    </div>
                    <p class="form-hint">Gunakan kombinasi huruf besar, huruf kecil, angka, dan simbol untuk password yang lebih kuat.</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Konfirmasi Password Baru</label>
                    <div class="input-password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-input"
                            placeholder="Ulangi password baru"
                            maxlength="200"
                            autocomplete="new-password"
                            required>
                        <button type="button" class="btn-toggle-pw" onclick="togglePw('confirmPassword', 'eye2')" tabindex="-1" aria-label="Tampilkan/sembunyikan password">
                            <svg id="eye2" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Error / success message -->
                <div class="form-error is-hidden" id="formMessage" role="alert" aria-live="polite"></div>

                <button type="submit" class="btn-login" id="btnSubmit">
                    <span class="btn-text">Simpan Password Baru</span>
                    <span class="btn-loader" id="submitLoader"></span>
                </button>
            </form>
        </div>

        <p class="login-footer">© 2026 WARTOS - BPS Kabupaten Karawang</p>
    </div>

    <script src="../static/js/shared/password_fields.js"></script>
    <script src="../static/js/auth/change_password.js"></script>
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>

</html>
