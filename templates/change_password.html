<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password — Dashboard BPS Kab. Tegal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="icon" href="../static/favicon.png">
    <style>
        /* ── Reuse login layout dengan sedikit tambahan ── */
        .change-pw-note {
            background: #FFF8F0;
            border: 1.5px solid #F4C08A;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }
        .change-pw-note svg {
            color: #E8700A;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .change-pw-note p {
            margin: 0;
            font-size: 0.82rem;
            color: #7A4A10;
            line-height: 1.5;
        }
        .change-pw-note p strong {
            display: block;
            font-size: 0.86rem;
            font-weight: 600;
            color: #C45D00;
            margin-bottom: 2px;
        }
        .pw-strength {
            margin-top: 6px;
        }
        .pw-strength-bar {
            height: 4px;
            border-radius: 2px;
            background: #E9ECEF;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .pw-strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .pw-strength-text {
            font-size: 0.75rem;
            color: var(--gray-500, #6c757d);
        }
        .form-hint {
            font-size: 0.77rem;
            color: var(--gray-400, #adb5bd);
            margin-top: 4px;
        }
    </style>
</head>

<body class="login-body">
    <div class="login-wrapper">
        <!-- Card -->
        <div class="login-card">
            <!-- Brand -->
            <div class="login-brand">
                <img src="../static/bps.svg" alt="BPS Logo" height="56">
                <div class="login-brand-text">
                    <h1>Ganti Password</h1>
                    <p>Badan Pusat Statistik Kabupaten Tegal</p>
                </div>
            </div>

            <div class="login-divider"></div>

            <!-- Notifikasi wajib ganti -->
            <div class="change-pw-note" id="mandatoryNote">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 8v4M12 16h.01"/>
                </svg>
                <p>
                    <strong>Wajib Ganti Password</strong>
                    Demi keamanan akun Anda, Anda harus mengganti password sebelum dapat mengakses dashboard.
                </p>
            </div>

            <!-- Form -->
            <form id="changePasswordForm" onsubmit="handleChangePassword(event)" novalidate>
                <div class="form-group">
                    <label class="form-label" for="newPassword">Password Baru</label>
                    <div class="input-password-wrapper">
                        <input
                            type="password"
                            id="newPassword"
                            class="form-input"
                            placeholder="Minimal 8 karakter"
                            maxlength="200"
                            autocomplete="new-password"
                            oninput="checkStrength(this.value)"
                            required>
                        <button type="button" class="btn-toggle-pw" onclick="togglePw('newPassword', 'eye1')" tabindex="-1" aria-label="Tampilkan/sembunyikan password">
                            <svg id="eye1" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                    <!-- Indikator kekuatan password -->
                    <div class="pw-strength">
                        <div class="pw-strength-bar">
                            <div class="pw-strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="pw-strength-text" id="strengthText"></span>
                    </div>
                    <p class="form-hint">Gunakan kombinasi huruf besar, huruf kecil, angka, dan simbol untuk password yang lebih kuat.</p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Konfirmasi Password Baru</label>
                    <div class="input-password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-input"
                            placeholder="Ulangi password baru"
                            maxlength="200"
                            autocomplete="new-password"
                            required>
                        <button type="button" class="btn-toggle-pw" onclick="togglePw('confirmPassword', 'eye2')" tabindex="-1" aria-label="Tampilkan/sembunyikan password">
                            <svg id="eye2" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Error / success message -->
                <div class="form-error" id="formMessage" role="alert" aria-live="polite" style="display:none"></div>

                <button type="submit" class="btn-login" id="btnSubmit">
                    <span class="btn-text">Simpan Password Baru</span>
                    <span class="btn-loader" id="submitLoader"></span>
                </button>
            </form>
        </div>

        <p class="login-footer">© 2026 BPS Kabupaten Tegal</p>
    </div>

    <script>
        // ── Cek session saat load ──────────────────────────────────────────────
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res  = await fetch("/api/me");
                const json = await res.json();
                // Jika tidak login atau sudah tidak perlu ganti password, redirect
                if (!res.ok || json.status !== "ok") {
                    window.location.href = "/login";
                    return;
                }
                if (!json.must_change_password) {
                    // Sudah punya flag false → hide mandatory note
                    document.getElementById("mandatoryNote").style.display = "none";
                }
            } catch (_) {
                window.location.href = "/login";
            }
        });

        // ── Password strength indicator ───────────────────────────────────────
        function checkStrength(pw) {
            const fill = document.getElementById("strengthFill");
            const text = document.getElementById("strengthText");
            if (!pw) { fill.style.width = "0%"; text.textContent = ""; return; }

            let score = 0;
            if (pw.length >= 8)  score++;
            if (pw.length >= 12) score++;
            if (/[A-Z]/.test(pw)) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;

            const levels = [
                { pct: "20%", color: "#e74c3c", label: "Sangat Lemah" },
                { pct: "40%", color: "#e67e22", label: "Lemah" },
                { pct: "60%", color: "#f1c40f", label: "Cukup" },
                { pct: "80%", color: "#2ecc71", label: "Kuat" },
                { pct: "100%", color: "#27ae60", label: "Sangat Kuat" },
            ];
            const lvl = levels[Math.min(score - 1, 4)] || levels[0];
            fill.style.width           = lvl.pct;
            fill.style.backgroundColor = lvl.color;
            text.textContent           = lvl.label;
            text.style.color           = lvl.color;
        }

        // ── Toggle password visibility ────────────────────────────────────────
        function togglePw(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon  = document.getElementById(iconId);
            const show  = input.type === "password";
            input.type  = show ? "text" : "password";
            icon.innerHTML = show
                ? `<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`
                : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
        }

        // ── Submit handler ────────────────────────────────────────────────────
        async function handleChangePassword(e) {
            e.preventDefault();
            const newPw  = document.getElementById("newPassword").value;
            const confPw = document.getElementById("confirmPassword").value;
            hideMsg();

            if (newPw.length < 8) {
                showMsg("Password baru minimal 8 karakter.", "error");
                return;
            }
            if (newPw !== confPw) {
                showMsg("Password baru dan konfirmasi tidak cocok.", "error");
                return;
            }

            setLoading(true);
            try {
                const res  = await fetch("/api/auth/change-password", {
                    method:  "POST",
                    headers: { "Content-Type": "application/json" },
                    body:    JSON.stringify({ new_password: newPw }),
                });
                const json = await res.json();

                if (res.ok && json.status === "ok") {
                    showMsg("Password berhasil diubah! Mengalihkan ke dashboard…", "success");
                    setTimeout(() => { window.location.href = "/"; }, 1500);
                } else {
                    showMsg(json.message || "Gagal mengubah password.", "error");
                }
            } catch (_) {
                showMsg("Gagal terhubung ke server. Coba lagi.", "error");
            } finally {
                setLoading(false);
            }
        }

        // ── Helpers ───────────────────────────────────────────────────────────
        function setLoading(on) {
            const btn    = document.getElementById("btnSubmit");
            const text   = btn.querySelector(".btn-text");
            const loader = document.getElementById("submitLoader");
            btn.disabled         = on;
            text.style.opacity   = on ? "0" : "1";
            loader.style.display = on ? "block" : "none";
        }

        function showMsg(msg, type) {
            const el = document.getElementById("formMessage");
            el.textContent  = msg;
            el.style.display = "block";
            if (type === "success") {
                el.style.background = "#d4edda";
                el.style.color      = "#155724";
                el.style.border     = "1px solid #c3e6cb";
                el.style.padding    = "10px 14px";
                el.style.borderRadius = "8px";
            } else {
                el.style.background = "";
                el.style.color      = "";
                el.style.border     = "";
                el.style.padding    = "";
                el.style.borderRadius = "";
            }
        }

        function hideMsg() {
            document.getElementById("formMessage").style.display = "none";
        }
    </script>
</body>

</html>
