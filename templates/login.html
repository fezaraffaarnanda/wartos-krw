<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — KABARE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/pages/auth.css">
    <link rel="icon" href="../static/favicon.png">
</head>

<body class="login-body">
    <div class="login-wrapper">
        <!-- Card -->
        <div class="login-card">
            <!-- Brand -->
            <div class="login-brand">
                <img src="../static/bps.svg" alt="BPS Logo" height="56">
                <div class="login-brand-text">
                    <h1>KABARE</h1>
                    <p>Kanal Berita & Rekomendasi Ekonomi</p>
                </div>
            </div>

            <div class="login-divider"></div>

            <!-- Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" autocomplete="on" novalidate>
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-input"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        maxlength="100"
                        required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            maxlength="200"
                            required>
                        <button type="button" class="btn-toggle-pw" onclick="togglePassword()" tabindex="-1"
                            aria-label="Tampilkan/sembunyikan password">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Error message -->
                <div class="form-error is-hidden" id="loginError" role="alert" aria-live="polite"></div>

                <button type="submit" class="btn-login" id="btnLogin">
                    <span class="btn-text">Masuk</span>
                    <span class="btn-loader" id="loginLoader"></span>
                </button>

                <div class="login-help-link-wrap">
                    <a class="login-help-link" href="/reset-password">Lupa password? Reset via kode autentikasi admin</a>
                </div>
            </form>
        </div>

        <p class="login-footer">© 2026 KABARE - BPS Kabupaten Tegal</p>
    </div>

    <script src="../static/js/pages/login.js"></script>
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>

</html>
